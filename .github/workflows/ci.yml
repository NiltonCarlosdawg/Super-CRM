name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # diário (eval)

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:contract
      # Task 20: baseline da avaliação no PR — determinístico, sem rede, sem segredos.
      - run: npm run eval:baseline

  # Task 20: avaliação com o fornecedor real. Segredos não podem ser referenciados
  # diretamente em `if:` (docs GitHub) — passam por `env` no job e o teste é por
  # passo. Hoje `npm run eval` é o baseline (modo LLM adiado ao gate A11); o job
  # fica pronto para quando AI_API_KEY + fornecedor forem aprovados.
  eval:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    defaults:
      run:
        working-directory: packages/backend
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      # Não-segredos via vars do repositório (provider/modelo Groq, compatível OpenAI).
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL }}
      AI_CANDIDATES: ${{ vars.AI_CANDIDATES }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/backend/package-lock.json
      - run: npm ci
      - name: Run eval
        if: env.AI_API_KEY != ''
        run: npm run eval
      - name: Upload eval report
        if: env.AI_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: packages/backend/reports/eval-report.md

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [backend, secret-scan]
    runs-on: ubuntu-latest
    # Só push para main: nunca PR, nem o cron diário (schedule), nem dispatch manual.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
      DEPLOY_FRONTEND_DOCROOT: ${{ vars.DEPLOY_FRONTEND_DOCROOT }}
      DEPLOY_BACKEND_ROOT: ${{ vars.DEPLOY_BACKEND_ROOT }}
      DEPLOY_RESTART_CMD: ${{ vars.DEPLOY_RESTART_CMD }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/frontend/package-lock.json
      - name: Build frontend
        working-directory: packages/frontend
        run: |
          npm ci
          npm run build
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          # O agent vive só neste passo: sem exportar para GITHUB_ENV o passo
          # seguinte arranca sem ele e o ssh falha com Permission denied (255).
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          echo "$SSH_PRIVATE_KEY" | ssh-add -
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Deploy to cPanel
        run: bash .github/scripts/deploy.sh
      - name: Verify
        run: |
          curl -fsS --retry 10 --retry-delay 5 --retry-connrefused "https://supcrm.milvendas.ao/" > /dev/null
          curl -fsS --retry 10 --retry-delay 5 "https://supcrm.milvendas.ao/v1/health/live" | grep -q '"status":"ok"'
          curl -fsS --retry 10 --retry-delay 5 "https://api.supercrm.milvendas.ao/health/live" | grep -q '"status":"ok"'
