# Ephemeral credentials of this throwaway test container — public by design,
# not secrets; they exist only while the integration tests run.
name: crm-test
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: crm_test
      POSTGRES_PASSWORD: crm_test
      POSTGRES_DB: crm_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_test -d crm_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
